function layer(){return $('.modal',TV)||$('.dlayer',TV)||TV;}
function focusables(scope){return $$('.f',scope).filter(e=>!e.disabled&&!e.closest('[data-off]'));}
function geo(from,dir,list){
  const a=from.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2;let best=null,bs=1e9;
  for(const e of list){ if(e===from)continue;
    const b=e.getBoundingClientRect(),bx=b.left+b.width/2,by=b.top+b.height/2;
    const dx=bx-ax,dy=by-ay,p=dir==='ArrowLeft'?-dx:dir==='ArrowRight'?dx:dir==='ArrowUp'?-dy:dy,o=dir==='ArrowLeft'||dir==='ArrowRight'?Math.abs(dy):Math.abs(dx);

  }
  return best;
}

function firstIn(sel){const e=focusables($(sel,TV)||TV)[0];go(e);}
function move(dir){
  const el=document.activeElement;

  const rail=el.closest('.rail');
  if(rail){
    if(dir==='ArrowRight'){closeRail(true);return;}
    if(dir==='ArrowLeft')return;
    const all=$$('.f',rail),i=all.indexOf(el),n=all[i+(dir==='ArrowDown'?1:-1)];go(n);return;

  const scope=layer(),list=focusables(scope).filter(e=>!e.closest('.rail'));

}
function rowsMove(el,dir){
  const inHero=el.closest('.hero');
  if(inHero){
    if(dir==='ArrowDown'){rowFocus(0);return true;}
    if(dir==='ArrowUp')return true;
    return false;
  }
  const r=+el.dataset.row,i=+el.dataset.i,row=$(`.row[data-r="${r}"]`,TV);
  if(dir==='ArrowLeft'){if(i===0){openRail();return true;}go($$('.card',row)[i-1]);return true;}

  if(dir==='ArrowUp'){if(r===0){const h=$('.hero .f',TV);if(h)go(h);return true;}rowFocus(r-1);return true;}
  if(dir==='ArrowDown'){rowFocus(r+1);return true;}
}
